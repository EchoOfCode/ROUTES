name: CD

on:
  # Manual dispatch only for now, per safety policy
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Target environment to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - staging
          - production

  # Uncomment the block below to automatically trigger CD on merge to main:
  # push:
  #   branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push GHCR Images
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.image_prefix.outputs.prefix }}
      commit_sha: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute Lowercase Image Prefix and SHA
        id: image_prefix
        run: |
          PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "prefix=$PREFIX" >> $GITHUB_OUTPUT
          echo "IMAGE_PREFIX=$PREFIX" >> $GITHUB_ENV

      - name: Compute Short SHA
        id: vars
        run: |
          echo "sha_short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/routes-api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/routes-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/routes-web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/routes-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/worker.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/routes-worker:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/routes-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Sandbox Manager Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/sandbox-manager.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/routes-sandbox-manager:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/routes-sandbox-manager:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Docker Proxy Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/docker-proxy.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/routes-docker-proxy:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/routes-docker-proxy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Gateway Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/gateway.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/routes-network-gateway:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/routes-network-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging (VPS)
    needs: [build-and-push]
    if: github.event_name == 'push' || github.event.inputs.deploy_env == 'all' || github.event.inputs.deploy_env == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH Key
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ secrets.STAGING_HOST }}
          PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync Compose and Scripts to Staging Server
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
          DEST: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          ssh -p "$PORT" "$USER@$HOST" "mkdir -p $DEST/scripts"
          scp -P "$PORT" docker-compose.prod.yml "$USER@$HOST:$DEST/docker-compose.prod.yml"
          scp -P "$PORT" scripts/healthcheck.sh scripts/rollback.sh "$USER@$HOST:$DEST/scripts/"
          ssh -p "$PORT" "$USER@$HOST" "chmod +x $DEST/scripts/*.sh"

      - name: Deploy and Verify Staging Stack
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
          DEST: ${{ secrets.STAGING_DEPLOY_PATH }}
          COMMIT_SHA: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          ssh -p "$PORT" "$USER@$HOST" bash -c "'
            set -euo pipefail
            cd \"$DEST\"

            # Save state for automatic rollback
            if [ -f .current_sha ]; then
              cp .current_sha .previous_sha
            fi
            echo \"$COMMIT_SHA\" > .current_sha

            # Authenticate to GHCR
            echo \"$GHCR_TOKEN\" | docker login ghcr.io -u \"$ACTOR\" --password-stdin

            # Update IMAGE_TAG in .env.prod
            if [ -f .env.prod ]; then
              if grep -q \"^IMAGE_TAG=\" .env.prod; then
                sed -i \"s/^IMAGE_TAG=.*/IMAGE_TAG=$COMMIT_SHA/\" .env.prod
              else
                echo \"IMAGE_TAG=$COMMIT_SHA\" >> .env.prod
              fi
            fi

            export IMAGE_TAG=\"$COMMIT_SHA\"

            echo \"Pulling new images for commit $COMMIT_SHA...\"
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull

            echo \"Running database migrations...\"
            docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm migrate

            echo \"Starting application services...\"
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans

            echo \"Executing post-deployment health check...\"
            if ! bash scripts/healthcheck.sh; then
              echo \"Health check failed! Executing automatic rollback...\"
              bash scripts/rollback.sh
              exit 1
            fi

            echo \"Staging deployment succeeded!\"
          '"

  deploy-production:
    name: Deploy to Production (VPS with Manual Approval)
    needs: [build-and-push, deploy-staging]
    if: github.event.inputs.deploy_env == 'all' || github.event.inputs.deploy_env == 'production' || (github.event_name == 'push' && success())
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH Key
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          HOST: ${{ secrets.PROD_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync Compose and Scripts to Production Server
        env:
          HOST: ${{ secrets.PROD_HOST }}
          USER: ${{ secrets.PROD_USER }}
          PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          DEST: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          ssh -p "$PORT" "$USER@$HOST" "mkdir -p $DEST/scripts"
          scp -P "$PORT" docker-compose.prod.yml "$USER@$HOST:$DEST/docker-compose.prod.yml"
          scp -P "$PORT" scripts/healthcheck.sh scripts/rollback.sh "$USER@$HOST:$DEST/scripts/"
          ssh -p "$PORT" "$USER@$HOST" "chmod +x $DEST/scripts/*.sh"

      - name: Deploy and Verify Production Stack
        env:
          HOST: ${{ secrets.PROD_HOST }}
          USER: ${{ secrets.PROD_USER }}
          PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          DEST: ${{ secrets.PROD_DEPLOY_PATH }}
          COMMIT_SHA: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          ssh -p "$PORT" "$USER@$HOST" bash -c "'
            set -euo pipefail
            cd \"$DEST\"

            # Save state for automatic rollback
            if [ -f .current_sha ]; then
              cp .current_sha .previous_sha
            fi
            echo \"$COMMIT_SHA\" > .current_sha

            # Authenticate to GHCR
            echo \"$GHCR_TOKEN\" | docker login ghcr.io -u \"$ACTOR\" --password-stdin

            # Update IMAGE_TAG in .env.prod
            if [ -f .env.prod ]; then
              if grep -q \"^IMAGE_TAG=\" .env.prod; then
                sed -i \"s/^IMAGE_TAG=.*/IMAGE_TAG=$COMMIT_SHA/\" .env.prod
              else
                echo \"IMAGE_TAG=$COMMIT_SHA\" >> .env.prod
              fi
            fi

            export IMAGE_TAG=\"$COMMIT_SHA\"

            echo \"Pulling new images for commit $COMMIT_SHA...\"
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull

            echo \"Running database migrations...\"
            docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm migrate

            echo \"Starting production application services...\"
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans

            echo \"Executing post-deployment health check...\"
            if ! bash scripts/healthcheck.sh; then
              echo \"Production health check failed! Executing automatic rollback...\"
              bash scripts/rollback.sh
              exit 1
            fi

            echo \"Production deployment succeeded!\"
          '"


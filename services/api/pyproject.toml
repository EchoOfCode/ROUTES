[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "routes-api"
version = "0.1.0"
description = "ROUTES REST API"
requires-python = ">=3.12"
dependencies = [
  "routes-shared",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "sqlalchemy>=2.0.30,<2.1",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "redis>=5.0",
  "rq>=1.16,<3",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "fakeredis>=2.23"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

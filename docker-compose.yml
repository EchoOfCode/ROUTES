name: routes

x-api-env: &api-env
  ROUTES_ENV: development
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-routes}
  REDIS_URL: redis://redis:6379/0
  SANDBOX_MANAGER_URL: http://sandbox-manager:8100
  SANDBOX_MANAGER_TOKEN: ${SANDBOX_MANAGER_TOKEN:?set in .env}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-72}
  ASSESSMENT_HISTORY_LIMIT: ${ASSESSMENT_HISTORY_LIMIT:-5}
  GATEWAY_DEV_ALLOW_HOSTS: ${GATEWAY_DEV_ALLOW_HOSTS:-}
  UPLOADS_DIR: /data/uploads

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-routes}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    image: routes/api:local
    command: ["python", "-m", "app.cli"]
    environment: *api-env
    volumes:
      - uploads:/data/uploads
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: routes/api:local
    environment: *api-env
    volumes:
      - uploads:/data/uploads
    networks: [backend, frontend]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  postgres_data: {}
  redis_data: {}
  uploads: {}

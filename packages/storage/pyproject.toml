[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "routes-storage"
version = "0.2.0"
description = "Local ROUTES storage: ~/.routes layout, configuration and the SQLite assessment database"
requires-python = ">=3.11"
dependencies = ["routes-shared", "routes-core", "sqlalchemy>=2.0.30,<3", "tomli-w>=1.0"]

[tool.setuptools.packages.find]
include = ["routes_storage*"]
